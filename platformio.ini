; =====================================================================
; ESPBasto — Contrôleur de chauffage Webasto
;
; Deux cibles matérielles :
;   - cyd       : ESP32-2432S028R (ILI9341 + XPT2046 + AHT21)
;   - crowpanel : CrowPanel Advance 2.8" HMI ESP32-S3
;                 (ST7789 + FT6236 capacitif + sonde DS18B20)
;   - native    : tests unitaires sur la machine hôte (pio test -e native)
;
; Compilation : pio run -e cyd   |   pio run -e crowpanel
; =====================================================================

[platformio]
; `pio run` sans -e ne doit compiler que les cibles embarquées ;
; l'env native est réservé aux tests unitaires (`pio test -e native`).
default_envs = cyd, crowpanel

[env:cyd]
; Version ÉPINGLÉE pour la reproductibilité : « espressif32 » nu se résout
; différemment selon la machine (ici : fork pioarduino, core 3.x/IDF 5 ;
; ailleurs : 6.x officiel, core 2.x). Le code compile sur les deux grâce
; au shim ESP-NOW (espnow_manager.cpp), mais on fige la version pour que
; tous les builds soient identiques.
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Les tests unitaires ne tournent qu'en natif, jamais sur cible
test_ignore = *

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    adafruit/Adafruit AHTX0
    adafruit/Adafruit MAX1704X
    lvgl/lvgl@^8.4

build_flags =
    ; --- TFT_eSPI : configuration ILI9341 sur ESP32-2432S028R ---
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DILI9341_DRIVER
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; --- LVGL 8.x ---
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}

[env:crowpanel]
; Version épinglée — voir le commentaire de [env:cyd].
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3 N8 : 8 Mo de flash (cf. tutoriel PlatformIO Elecrow)
board_build.partitions = default_8MB.csv
; Les tests unitaires ne tournent qu'en natif, jamais sur cible
test_ignore = *

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit MAX1704X
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.3
    lvgl/lvgl@^8.4

build_flags =
    ; --- Sélection du matériel CrowPanel dans le code (config.h) ---
    -DHW_CROWPANEL
    ; --- Console série sur l'USB-C natif de l'ESP32-S3 ---
    ; La carte expose l'USB-Serial/JTAG natif (pas de pont UART) :
    ; sans ce drapeau, Serial sortirait sur l'UART0 interne et le
    ; moniteur série USB resterait muet.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI : configuration ST7789 sur CrowPanel Advance 2.8 ---
    ; Pins issues du code d'usine Elecrow (LovyanGFX_Driver.h) :
    ; SCLK=42, MOSI=39, CS=40, DC=41, RST absent, BL=38.
    ;
    ; USE_FSPI_PORT est INDISPENSABLE sur ESP32-S3 : sans lui, TFT_eSPI
    ; prend SPI_PORT = FSPI = 0, or la macro IDF REG_SPI_BASE(i) renvoie 0
    ; pour i < 2 (seuls GPSPI2/GPSPI3 existent sur S3) → tous les accès
    ; registre-direct pointent vers l'adresse ~0 → StoreProhibited dans
    ; tft.init() au boot (vérifié par désassemblage). Avec USE_FSPI_PORT,
    ; SPI_PORT = 2 (GPSPI2) = le SPI2_HOST du code d'usine Elecrow.
    -DUSE_FSPI_PORT
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=39
    -DTFT_SCLK=42
    -DTFT_CS=40
    -DTFT_DC=41
    -DTFT_RST=-1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    ; Le panneau IPS du CrowPanel fonctionne en mode couleurs inversées
    ; (cfg.invert = true dans le code d'usine)
    -DTFT_INVERSION_ON
    ; Ordre des couleurs : passer à TFT_BGR si rouge et bleu sont inversés
    -DTFT_RGB_ORDER=TFT_RGB
    ; 80 MHz en écriture comme le code d'usine Elecrow
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000
    ; --- LVGL 8.x ---
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}

; ---------------------------------------------------------------------
; BANC DE TEST série (jamais en production !) :
;   pio run -e crowpanel_test --target upload
; Identique à crowpanel + interface série de test (-DTEST_CLI) :
; simulation de température et pilotage des modes par USB, pour les
; campagnes de test automatisées. L'interface permet de piloter le
; chauffage par USB : NE PAS flasher ce firmware pour l'usage réel.
; ---------------------------------------------------------------------
[env:crowpanel_test]
extends = env:crowpanel
build_flags =
    ${env:crowpanel.build_flags}
    -DTEST_CLI

; ---------------------------------------------------------------------
; Tests unitaires natifs (logique pure, sans matériel) :
;   pio test -e native
; Ne compile PAS src/ (code Arduino) : les tests incluent directement
; les en-têtes purs (touch_mapping.h, sensor_validation.h).
; ---------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
